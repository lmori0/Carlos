<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 2</title>
  <style>
     body {
      margin: 0;
      font-family: "Comic Sans MS", cursive, sans-serif;
      text-align: center;
      color: #f58ab5;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('images/flowy.gif') center / cover no-repeat;
      z-index: -1;
    }

    .container {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      margin: 40px auto;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    }

    .image-box img {
      width: 150px;
      border-radius: 15px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 2rem;
      color: #f987c0;
      text-shadow: 2px 2px #ffd6eb;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      margin: 10px;
      font-size: 1rem;
      background: #fd97ca;
      color: white;
      border-radius: 25px;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.2s;
    }

    .btn:hover {
      background: #f88ec3;
      transform: scale(1.05);
    }

    .btn.no {
      background: #cccccc;
      color: #333;
    }

    .btn.no:hover {
      background: #999999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="image-box">
      <img src="images/envelope.jpg" alt="Cute image"> 
    </div>
    <h1>Open itt pls? ㄟ(≧◇≦)ㄏ</h1>
    <a href="page4.html" class="btn">Open it</a>
    <a href="page3.html" class="btn no">No ty</a>
  </div>
</body>
</html>
