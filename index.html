<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday</title>
<style>
    body {
      margin: 0;
      font-family: "Comic Sans MS", cursive, sans-serif;
      text-align: center;
      color: #ef83ae;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('images/flowy.gif') center / cover no-repeat;
      z-index: -1;
    }

    .container {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      margin: 40px auto;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    }

    .image-box img {
      width: 150px;
      border-radius: 15px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 2rem;
      font-weight: bold;
      color: #ed89bb;
      text-shadow: 2px 2px #ffd6eb;
    }

    h2 {
      font-size: 1.5rem;
      margin-top: 10px;
      color: #f789b5;
    }

    p {
      font-size: 1.2rem;
      margin: 15px 0;
      color: #444;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      margin-top: 20px;
      font-size: 1rem;
      background: #fa93c7;
      color: white;
      border-radius: 25px;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    .btn:hover {
      background: #f495c4;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="image-box">
      <img src="images/180sx.jpg" alt="images/whiteflower.jpg"> 
    </div>
    <h1>Happy Birthday!</h1>
    <h2>mi amor..</h2>
    <p>ヾ(≧▽≦*)o</p>
    <p>Click the next button, if u want ❤️</p>
    <a href="page2.html" class="btn">Nextt :3 </a>
  </div>
</body>
</html>
